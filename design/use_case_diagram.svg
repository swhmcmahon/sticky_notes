<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #1B3A5C; }
      .usecase-text { font-size: 14px; fill: #1B3A5C; }
      .actor-text { font-size: 14px; font-weight: bold; fill: #1B3A5C; }
      .boundary-label { font-size: 15px; font-weight: bold; fill: #1B3A5C; }
      .line { stroke: #1B3A5C; stroke-width: 1.5; fill: none; }
      .include-line { stroke: #C9A227; stroke-width: 1.3; stroke-dasharray: 5,4; fill: none; }
      .include-label { font-size: 11px; font-style: italic; fill: #8a6d10; }
      .ellipse { fill: #FFFFFF; stroke: #C9A227; stroke-width: 2; }
    </style>
    <marker id="openArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#8a6d10" stroke-width="1.3"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" class="title">Use Case Diagram &#8212; Sticky Notes Application (posts app)</text>

  <!-- System boundary -->
  <rect x="230" y="60" width="520" height="530" fill="#F7F5F0" stroke="#1B3A5C" stroke-width="2" rx="6"/>
  <text x="490" y="85" text-anchor="middle" class="boundary-label">Sticky Notes Application</text>

  <!-- Actor: User -->
  <g>
    <circle cx="90" cy="160" r="14" fill="none" stroke="#1B3A5C" stroke-width="2"/>
    <line x1="90" y1="174" x2="90" y2="220" class="line"/>
    <line x1="60" y1="190" x2="120" y2="190" class="line"/>
    <line x1="90" y1="220" x2="65" y2="255" class="line"/>
    <line x1="90" y1="220" x2="115" y2="255" class="line"/>
    <text x="90" y="280" text-anchor="middle" class="actor-text">User</text>
  </g>

  <!-- Use cases -->
  <ellipse cx="490" cy="130" rx="150" ry="32" class="ellipse"/>
  <text x="490" y="135" text-anchor="middle" class="usecase-text">Create Post</text>

  <ellipse cx="490" cy="210" rx="150" ry="32" class="ellipse"/>
  <text x="490" y="215" text-anchor="middle" class="usecase-text">View Post List</text>

  <ellipse cx="490" cy="290" rx="150" ry="32" class="ellipse"/>
  <text x="490" y="295" text-anchor="middle" class="usecase-text">View Post Details</text>

  <ellipse cx="490" cy="370" rx="150" ry="32" class="ellipse"/>
  <text x="490" y="375" text-anchor="middle" class="usecase-text">Update Post</text>

  <ellipse cx="490" cy="450" rx="150" ry="32" class="ellipse"/>
  <text x="490" y="455" text-anchor="middle" class="usecase-text">Delete Post</text>

  <ellipse cx="490" cy="545" rx="150" ry="32" class="ellipse"/>
  <text x="490" y="542" text-anchor="middle" class="usecase-text">Confirm Deletion</text>
  <text x="490" y="558" text-anchor="middle" font-size="10.5" fill="#555">(are you sure? step)</text>

  <!-- Associations -->
  <line x1="90" y1="180" x2="343" y2="130" class="line"/>
  <line x1="90" y1="200" x2="343" y2="210" class="line"/>
  <line x1="90" y1="220" x2="343" y2="290" class="line"/>
  <line x1="90" y1="240" x2="343" y2="370" class="line"/>
  <line x1="90" y1="255" x2="343" y2="450" class="line"/>

  <!-- include relationship: Delete Post includes Confirm Deletion -->
  <path d="M490,482 C490,505 490,505 490,513" class="include-line" marker-end="url(#openArrow)"/>
  <text x="590" y="500" text-anchor="middle" class="include-label">&#171;include&#187;</text>

</svg>
