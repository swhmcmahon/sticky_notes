<text x="860" y="456" class="msg">INSERT INTO posts_post</text>
<line x1="854" y1="500" x2="546" y2="500" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
