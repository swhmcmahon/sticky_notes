  <text x="469" y="24" text-anchor="middle" font-size="22" font-weight="bold" fill="#1B3A5C">Sequence Diagrams &#8212; Sticky Notes Application (CRUD)</text>
<text x="469" y="68" text-anchor="middle" class="title">1. Create Sticky Note (Post)</text>
<text x="469" y="88" text-anchor="middle" class="subtitle">User submits the “Add post” form; a new Post row is inserted and the browser is redirected to the list</text>
