<svg viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #1B3A5C; }
      .cls-header { font-size: 15px; font-weight: bold; fill: #FFFFFF; }
      .cls-stereo { font-size: 11px; font-style: italic; fill: #E8E2D0; }
      .cls-body { font-size: 12.5px; fill: #1B3A5C; }
      .cls-section { stroke: #1B3A5C; stroke-width: 1; }
      .rel-label { font-size: 12px; fill: #1B3A5C; font-style: italic; }
      .mult { font-size: 11px; fill: #1B3A5C; }
    </style>
    <marker id="openArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#1B3A5C" stroke-width="1.3"/>
    </marker>
    <marker id="diamond" markerWidth="14" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M1,5 L7,1 L13,5 L7,9 Z" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="1.2"/>
    </marker>
  </defs>

  <text x="490" y="30" text-anchor="middle" class="title">Class Diagram &#8212; Sticky Notes Application (posts app)</text>

  <!-- Author class -->
  <g>
    <rect x="40" y="80" width="220" height="120" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="1.5"/>
    <rect x="40" y="80" width="220" height="46" fill="#1B3A5C"/>
    <text x="150" y="98" text-anchor="middle" class="cls-stereo">&#171;model&#187;</text>
    <text x="150" y="117" text-anchor="middle" class="cls-header">Author</text>
    <line x1="40" y1="126" x2="260" y2="126" class="cls-section"/>
    <text x="52" y="146" class="cls-body">+ id: AutoField</text>
    <text x="52" y="166" class="cls-body">+ name: CharField(max_length=255)</text>
    <line x1="40" y1="176" x2="260" y2="176" class="cls-section"/>
    <text x="52" y="194" class="cls-body">+ __str__(): str</text>
  </g>

  <!-- Post class -->
  <g>
    <rect x="360" y="70" width="270" height="230" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="1.5"/>
    <rect x="360" y="70" width="270" height="46" fill="#1B3A5C"/>
    <text x="495" y="88" text-anchor="middle" class="cls-stereo">&#171;model&#187;</text>
    <text x="495" y="107" text-anchor="middle" class="cls-header">Post</text>
    <line x1="360" y1="116" x2="630" y2="116" class="cls-section"/>
    <text x="372" y="135" class="cls-body">+ id: AutoField</text>
    <text x="372" y="155" class="cls-body">+ title: CharField(max_length=255)</text>
    <text x="372" y="175" class="cls-body">+ content: TextField</text>
    <text x="372" y="195" class="cls-body">+ created_at: DateTimeField</text>
    <text x="372" y="211" class="cls-body">   (auto_now_add=True)</text>
    <text x="372" y="231" class="cls-body">+ author: ForeignKey(Author)</text>
    <text x="372" y="247" class="cls-body">   (null=True, blank=True,</text>
    <text x="372" y="263" class="cls-body">    on_delete=CASCADE)</text>
    <line x1="360" y1="273" x2="630" y2="273" class="cls-section"/>
    <text x="372" y="292" class="cls-body">+ __str__(): str</text>
  </g>

  <!-- PostForm class -->
  <g>
    <rect x="730" y="70" width="220" height="170" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="1.5"/>
    <rect x="730" y="70" width="220" height="46" fill="#1B3A5C"/>
    <text x="840" y="88" text-anchor="middle" class="cls-stereo">&#171;form&#187;</text>
    <text x="840" y="107" text-anchor="middle" class="cls-header">PostForm</text>
    <line x1="730" y1="116" x2="950" y2="116" class="cls-section"/>
    <text x="742" y="135" class="cls-body" font-size="11.5">(extends forms.ModelForm)</text>
    <line x1="730" y1="145" x2="950" y2="145" class="cls-section"/>
    <text x="742" y="164" class="cls-body" font-size="11.5">Meta.model = Post</text>
    <text x="742" y="182" class="cls-body" font-size="11.5">Meta.fields = ["title",</text>
    <text x="742" y="198" class="cls-body" font-size="11.5">  "content", "author"]</text>
    <text x="742" y="218" class="cls-body">+ is_valid(): bool</text>
  </g>

  <!-- Views module -->
  <g>
    <rect x="360" y="400" width="380" height="260" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="1.5"/>
    <rect x="360" y="400" width="380" height="46" fill="#1B3A5C"/>
    <text x="550" y="418" text-anchor="middle" class="cls-stereo">&#171;module&#187;</text>
    <text x="550" y="437" text-anchor="middle" class="cls-header">posts/views.py</text>
    <line x1="360" y1="446" x2="740" y2="446" class="cls-section"/>
    <text x="372" y="466" class="cls-body">+ post_list(request): HttpResponse</text>
    <text x="372" y="486" class="cls-body">+ post_detail(request, pk): HttpResponse</text>
    <text x="372" y="506" class="cls-body">+ post_create(request): HttpResponse</text>
    <text x="372" y="526" class="cls-body">+ post_update(request, pk): HttpResponse</text>
    <text x="372" y="546" class="cls-body">+ post_delete(request, pk): HttpResponse</text>
    <text x="372" y="562" class="cls-body" font-size="11">   (GET = confirm, POST = delete)</text>
    <line x1="360" y1="574" x2="740" y2="574" class="cls-section"/>
    <text x="372" y="594" class="cls-body" font-style="italic" font-size="11.5">Each view interacts with Post/Author</text>
    <text x="372" y="610" class="cls-body" font-style="italic" font-size="11.5">(the models) and PostForm to implement</text>
    <text x="372" y="626" class="cls-body" font-style="italic" font-size="11.5">CRUD behaviour, then renders a</text>
    <text x="372" y="642" class="cls-body" font-style="italic" font-size="11.5">template with the result.</text>
  </g>

  <!-- Relationships -->
  <!-- Author to Post: one author writes zero or more posts -->
  <line x1="260" y1="150" x2="360" y2="150" stroke="#1B3A5C" stroke-width="1.3" marker-start="url(#diamond)"/>
  <text x="270" y="142" class="mult">1</text>
  <text x="340" y="142" class="mult">0..*</text>
  <text x="310" y="165" text-anchor="middle" class="rel-label">writes</text>

  <!-- PostForm -> Post (dependency, uses/creates) -->
  <line x1="730" y1="180" x2="632" y2="180" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="680" y="172" text-anchor="middle" class="rel-label">&#171;creates/updates&#187;</text>

  <!-- Views -> Post -->
  <line x1="450" y1="400" x2="480" y2="302" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="410" y="355" text-anchor="middle" class="rel-label">&#171;uses&#187;</text>

  <!-- Views -> Author (for the optional author dropdown) -->
  <line x1="380" y1="400" x2="180" y2="202" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="230" y="330" text-anchor="middle" class="rel-label" transform="rotate(-58 230 330)">&#171;uses&#187;</text>

  <!-- Views -> PostForm -->
  <line x1="700" y1="400" x2="840" y2="242" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="810" y="330" text-anchor="middle" class="rel-label">&#171;uses&#187;</text>

</svg>
