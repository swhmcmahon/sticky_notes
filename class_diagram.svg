<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #1B3A5C; }
      .cls-header { font-size: 15px; font-weight: bold; fill: #FFFFFF; }
      .cls-stereo { font-size: 11px; font-style: italic; fill: #E8E2D0; }
      .cls-body { font-size: 12.5px; fill: #1B3A5C; }
      .cls-section { stroke: #1B3A5C; stroke-width: 1; }
      .rel-label { font-size: 12px; fill: #1B3A5C; font-style: italic; }
    </style>
    <marker id="openArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#1B3A5C" stroke-width="1.3"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">Class Diagram &#8212; Sticky Notes Application</text>

  <!-- Note class -->
  <g>
    <rect x="80" y="70" width="260" height="230" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="1.5"/>
    <rect x="80" y="70" width="260" height="46" fill="#1B3A5C"/>
    <text x="210" y="88" text-anchor="middle" class="cls-stereo">&#171;model&#187;</text>
    <text x="210" y="107" text-anchor="middle" class="cls-header">Note</text>
    <line x1="80" y1="116" x2="340" y2="116" class="cls-section"/>
    <text x="92" y="135" class="cls-body">+ id: AutoField</text>
    <text x="92" y="155" class="cls-body">+ title: CharField(max_length=255)</text>
    <text x="92" y="175" class="cls-body">+ content: TextField</text>
    <text x="92" y="195" class="cls-body">+ created_at: DateTimeField</text>
    <text x="92" y="215" class="cls-body">   (auto_now_add=True)</text>
    <text x="92" y="235" class="cls-body">+ updated_at: DateTimeField</text>
    <text x="92" y="255" class="cls-body">   (auto_now=True)</text>
    <line x1="80" y1="265" x2="340" y2="265" class="cls-section"/>
    <text x="92" y="285" class="cls-body">+ __str__(): str</text>
  </g>

  <!-- NoteForm class -->
  <g>
    <rect x="480" y="70" width="270" height="150" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="1.5"/>
    <rect x="480" y="70" width="270" height="46" fill="#1B3A5C"/>
    <text x="615" y="88" text-anchor="middle" class="cls-stereo">&#171;form&#187;</text>
    <text x="615" y="107" text-anchor="middle" class="cls-header">NoteForm</text>
    <line x1="480" y1="116" x2="750" y2="116" class="cls-section"/>
    <text x="492" y="135" class="cls-body">(extends forms.ModelForm)</text>
    <line x1="480" y1="145" x2="750" y2="145" class="cls-section"/>
    <text x="492" y="165" class="cls-body">Meta.model = Note</text>
    <text x="492" y="185" class="cls-body">Meta.fields = ["title", "content"]</text>
    <text x="492" y="205" class="cls-body">+ is_valid(): bool</text>
  </g>

  <!-- Views class/module -->
  <g>
    <rect x="480" y="320" width="330" height="260" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="1.5"/>
    <rect x="480" y="320" width="330" height="46" fill="#1B3A5C"/>
    <text x="645" y="338" text-anchor="middle" class="cls-stereo">&#171;module&#187;</text>
    <text x="645" y="357" text-anchor="middle" class="cls-header">views.py</text>
    <line x1="480" y1="366" x2="810" y2="366" class="cls-section"/>
    <text x="492" y="386" class="cls-body">+ note_list(request): HttpResponse</text>
    <text x="492" y="406" class="cls-body">+ note_detail(request, pk): HttpResponse</text>
    <text x="492" y="426" class="cls-body">+ note_create(request): HttpResponse</text>
    <text x="492" y="446" class="cls-body">+ note_update(request, pk): HttpResponse</text>
    <text x="492" y="466" class="cls-body">+ note_delete(request, pk): HttpResponse</text>
    <line x1="480" y1="480" x2="810" y2="480" class="cls-section"/>
    <text x="492" y="500" class="cls-body" font-style="italic" font-size="11.5">Each view interacts with Note</text>
    <text x="492" y="516" class="cls-body" font-style="italic" font-size="11.5">(the model) and NoteForm to</text>
    <text x="492" y="532" class="cls-body" font-style="italic" font-size="11.5">implement CRUD behaviour, then</text>
    <text x="492" y="548" class="cls-body" font-style="italic" font-size="11.5">renders a template with the result.</text>
  </g>

  <!-- Relationships -->
  <!-- NoteForm -> Note (dependency, uses/creates) -->
  <line x1="480" y1="145" x2="345" y2="145" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="410" y="135" text-anchor="middle" class="rel-label">&#171;creates/updates&#187;</text>

  <!-- Views -> Note -->
  <line x1="480" y1="400" x2="215" y2="300" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="330" y="370" text-anchor="middle" class="rel-label" transform="rotate(-25 330 370)">&#171;uses&#187;</text>

  <!-- Views -> NoteForm -->
  <line x1="645" y1="320" x2="630" y2="220" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="700" y="270" text-anchor="middle" class="rel-label">&#171;uses&#187;</text>
</svg>