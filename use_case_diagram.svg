<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #1B3A5C; }
      .usecase-text { font-size: 14px; fill: #1B3A5C; }
      .actor-text { font-size: 14px; font-weight: bold; fill: #1B3A5C; }
      .boundary-label { font-size: 15px; font-weight: bold; fill: #1B3A5C; }
      .line { stroke: #1B3A5C; stroke-width: 1.5; fill: none; }
      .ellipse { fill: #FFFFFF; stroke: #C9A227; stroke-width: 2; }
    </style>
  </defs>

  <text x="400" y="30" text-anchor="middle" class="title">Use Case Diagram &#8212; Sticky Notes Application</text>

  <!-- System boundary -->
  <rect x="230" y="60" width="520" height="460" fill="#F7F5F0" stroke="#1B3A5C" stroke-width="2" rx="6"/>
  <text x="490" y="85" text-anchor="middle" class="boundary-label">Sticky Notes Application</text>

  <!-- Actor: User -->
  <g>
    <circle cx="90" cy="150" r="14" fill="none" stroke="#1B3A5C" stroke-width="2"/>
    <line x1="90" y1="164" x2="90" y2="210" class="line"/>
    <line x1="60" y1="180" x2="120" y2="180" class="line"/>
    <line x1="90" y1="210" x2="65" y2="245" class="line"/>
    <line x1="90" y1="210" x2="115" y2="245" class="line"/>
    <text x="90" y="270" text-anchor="middle" class="actor-text">User</text>
  </g>

  <!-- Use cases -->
  <ellipse cx="490" cy="130" rx="130" ry="32" class="ellipse"/>
  <text x="490" y="135" text-anchor="middle" class="usecase-text">Create Sticky Note</text>

  <ellipse cx="490" cy="210" rx="130" ry="32" class="ellipse"/>
  <text x="490" y="215" text-anchor="middle" class="usecase-text">View List of Notes</text>

  <ellipse cx="490" cy="290" rx="130" ry="32" class="ellipse"/>
  <text x="490" y="295" text-anchor="middle" class="usecase-text">View Note Details</text>

  <ellipse cx="490" cy="370" rx="130" ry="32" class="ellipse"/>
  <text x="490" y="375" text-anchor="middle" class="usecase-text">Update Sticky Note</text>

  <ellipse cx="490" cy="450" rx="130" ry="32" class="ellipse"/>
  <text x="490" y="455" text-anchor="middle" class="usecase-text">Delete Sticky Note</text>

  <!-- Associations -->
  <line x1="90" y1="180" x2="360" y2="130" class="line"/>
  <line x1="90" y1="200" x2="360" y2="210" class="line"/>
  <line x1="90" y1="220" x2="360" y2="290" class="line"/>
  <line x1="90" y1="240" x2="360" y2="370" class="line"/>
  <line x1="90" y1="255" x2="360" y2="450" class="line"/>

</svg>