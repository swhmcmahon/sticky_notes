<svg viewBox="0 0 1040 1080" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #1B3A5C; }
      .participant { font-size: 13px; font-weight: bold; fill: #FFFFFF; }
      .lifeline { stroke: #1B3A5C; stroke-width: 1; stroke-dasharray: 3,3; }
      .msg { font-size: 11px; fill: #1B3A5C; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1B3A5C"/>
    </marker>
  </defs>
  <text x="520" y="30" text-anchor="middle" class="title">Sequence Diagram &#8212; Creating a Sticky Note (then viewing the list)</text>
  <text x="520" y="55" text-anchor="middle" font-size="13" fill="#555" font-style="italic">Scenario: User creates a note, is redirected, and the updated note list is displayed</text>
  <rect x="15" y="90" width="130" height="40" fill="#1B3A5C" rx="4"/><text x="80" y="115" text-anchor="middle" class="participant">User</text><line x1="80" y1="130" x2="80" y2="1040" class="lifeline"/><rect x="160" y="90" width="130" height="40" fill="#1B3A5C" rx="4"/><text x="225" y="115" text-anchor="middle" class="participant">Browser</text><line x1="225" y1="130" x2="225" y2="1040" class="lifeline"/><rect x="305" y="90" width="130" height="40" fill="#1B3A5C" rx="4"/><text x="370" y="115" text-anchor="middle" class="participant">urls.py</text><line x1="370" y1="130" x2="370" y2="1040" class="lifeline"/><rect x="450" y="90" width="130" height="40" fill="#1B3A5C" rx="4"/><text x="515" y="115" text-anchor="middle" class="participant">views.py</text><line x1="515" y1="130" x2="515" y2="1040" class="lifeline"/><rect x="600" y="90" width="130" height="40" fill="#1B3A5C" rx="4"/><text x="665" y="115" text-anchor="middle" class="participant">NoteForm</text><line x1="665" y1="130" x2="665" y2="1040" class="lifeline"/><rect x="750" y="90" width="130" height="40" fill="#1B3A5C" rx="4"/><text x="815" y="115" text-anchor="middle" class="participant">Note (Model)</text><line x1="815" y1="130" x2="815" y2="1040" class="lifeline"/><rect x="900" y="90" width="130" height="40" fill="#1B3A5C" rx="4"/><text x="965" y="115" text-anchor="middle" class="participant">Database</text><line x1="965" y1="130" x2="965" y2="1040" class="lifeline"/>
  <line x1="80" y1="160" x2="225" y2="160" stroke="#1B3A5C" stroke-width="1.3" marker-end="url(#arrowhead)"/><text x="152.5" y="154.0" text-anchor="middle" class="msg">Fill in title & content, click Save</text><line x1="225" y1="206.31578947368422" x2="370" y2="206.31578947368422" stroke="#1B3A5C" stroke-width="1.3" marker-end="url(#arrowhead)"/><text x="297.5" y="200.3" text-anchor="middle" class="msg">POST /notes/new/</text><line x1="370" y1="252.63157894736844" x2="515" y2="252.63157894736844" stroke="#1B3A5C" stroke-width="1.3" marker-end="url(#arrowhead)"/><text x="442.5" y="246.6" text-anchor="middle" class="msg">route to note_create(request)</text><line x1="515" y1="298.94736842105266" x2="665" y2="298.94736842105266" stroke="#1B3A5C" stroke-width="1.3" marker-end="url(#arrowhead)"/><text x="590.0" y="292.9" text-anchor="middle" class="msg">NoteForm(request.POST)</text><path d="M665,345.2631578947369 h30 v20 h-30" fill="none" stroke="#1B3A5C" stroke-width="1.3" marker-end="url(#arrowhead)"/><text x="675" y="339.2631578947369" class="msg">is_valid()</text><line x1="665" y1="391.5789473684211" x2="515" y2="391.5789473684211" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/><text x="590.0" y="385.6" text-anchor="middle" class="msg">validated data</text><line x1="515" y1="437.8947368421053" x2="815" y2="437.8947368421053" stroke="#1B3A5C" stroke-width="1.3" marker-end="url(#arrowhead)"/><text x="665.0" y="431.9" text-anchor="middle" class="msg">form.save(commit=False) -> note.save()</text><line x1="815" y1="484.21052631578954" x2="965" y2="484.21052631578954" stroke="#1B3A5C" stroke-width="1.3" marker-end="url(#arrowhead)"/><text x="890.0" y="478.2" text-anchor="middle" class="msg">INSERT INTO notes_note</text><line x1="965" y1="530.5263157894738" x2="815" y2="530.5263157894738" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/><text x="890.0" y="524.5" text-anchor="middle" class="msg">new row id</text><line x1="815" y1="576.8421052631579" x2="515" y2="576.8421052631579" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/><text x="665.0" y="570.8" text-anchor="middle" class="msg">return saved Note instance</text><line x1="515" y1="623.1578947368421" x2="225" y2="623.1578947368421" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/><text x="370.0" y="617.2" text-anchor="middle" class="msg">HttpResponseRedirect(note_list)</text><line x1="225" y1="669.4736842105262" x2="370" y2="669.4736842105262" stroke="#1B3A5C" stroke-width="1.3" marker-end="url(#arrowhead)"/><text x="297.5" y="663.5" text-anchor="middle" class="msg">GET /</text><line x1="370" y1="715.7894736842104" x2="515" y2="715.7894736842104" stroke="#1B3A5C" stroke-width="1.3" marker-end="url(#arrowhead)"/><text x="442.5" y="709.8" text-anchor="middle" class="msg">route to note_list(request)</text><line x1="515" y1="762.1052631578946" x2="815" y2="762.1052631578946" stroke="#1B3A5C" stroke-width="1.3" marker-end="url(#arrowhead)"/><text x="665.0" y="756.1" text-anchor="middle" class="msg">Note.objects.all()</text><line x1="815" y1="808.4210526315787" x2="965" y2="808.4210526315787" stroke="#1B3A5C" stroke-width="1.3" marker-end="url(#arrowhead)"/><text x="890.0" y="802.4" text-anchor="middle" class="msg">SELECT * FROM notes_note</text><line x1="965" y1="854.7368421052629" x2="815" y2="854.7368421052629" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/><text x="890.0" y="848.7" text-anchor="middle" class="msg">return rows</text><line x1="815" y1="901.0526315789471" x2="515" y2="901.0526315789471" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/><text x="665.0" y="895.1" text-anchor="middle" class="msg">return queryset</text><line x1="515" y1="947.3684210526312" x2="225" y2="947.3684210526312" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/><text x="370.0" y="941.4" text-anchor="middle" class="msg">render(note_list.html, context)</text><line x1="225" y1="993.6842105263154" x2="80" y2="993.6842105263154" stroke="#1B3A5C" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/><text x="152.5" y="987.7" text-anchor="middle" class="msg">Display updated list of notes</text>
</svg>