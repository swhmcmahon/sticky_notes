<!-- posts/templates/posts/post_confirm_delete.html -->
{% extends 'base.html' %}

{% block title %}
  Bulletin Board - Delete Post
{% endblock %}

{% block content %}
  <h2>Delete Post</h2>
  <p>Are you sure you want to delete "<strong>{{ post.title }}</strong>"? This action cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'post_detail' pk=post.pk %}">Cancel</a>
  </form>
{% endblock %}
